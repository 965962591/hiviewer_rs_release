<main><h2>Image processing preview</h2><p>Oriented sRGB preview, maximum 2048 pixels. Export creates a new PNG.</p>
<label>Exposure <input id="exposure" type="range" min="-2" max="2" step="0.1" value="0"></label>
<button id="save" disabled>Export preview</button><p id="status" role="status"></p><canvas id="preview"></canvas></main>
